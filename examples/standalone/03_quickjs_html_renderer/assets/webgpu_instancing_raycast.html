<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - instancing - raycast</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	</head>
	<body>
		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.170.0/build/three.webgpu.js",
					"three/webgpu": "https://unpkg.com/three@0.170.0/build/three.webgpu.js",
					"three/tsl": "https://unpkg.com/three@0.170.0/build/three.tsl.js",
					"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import './webgpu-runtime.js';
			import * as THREE from './vendor/three.webgpu.js';
			import { OrbitControls } from './vendor/OrbitControls.js';

			let camera, scene, renderer, controls;

			let mesh;
			const amount = parseInt( window.location.search.slice( 1 ) ) || 10;
			const count = Math.pow( amount, 3 );

			const raycaster = new THREE.Raycaster();
			const mouse = new THREE.Vector2( 1, 1 );

			const color = new THREE.Color();
			const white = new THREE.Color().setHex( 0xffffff );

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( amount, amount, amount );
				camera.lookAt( 0, 0, 0 );

				scene = new THREE.Scene();

				const light = new THREE.HemisphereLight( 0xffffff, 0x888888, 3 );
				light.position.set( 0, 1, 0 );
				scene.add( light );

				const geometry = new THREE.IcosahedronGeometry( 0.5, 3 );
				const material = new THREE.MeshPhongMaterial( { color: 0xffffff } );

				mesh = new THREE.InstancedMesh( geometry, material, count );

				let i = 0;
				const offset = ( amount - 1 ) / 2;

				const matrix = new THREE.Matrix4();

				for ( let x = 0; x < amount; x ++ ) {

					for ( let y = 0; y < amount; y ++ ) {

						for ( let z = 0; z < amount; z ++ ) {

							matrix.setPosition( offset - x, offset - y, offset - z );

							mesh.setMatrixAt( i, matrix );
							mesh.setColorAt( i, color );

							i ++;

						}

					}

				}

				scene.add( mesh );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
                await renderer.init();
				renderer.setPixelRatio( window.devicePixelRatio || 1 );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				const container = document.createElement('div');
				container.style.position = 'absolute';
				container.style.width = '100%';
				container.style.height = '100%';
				container.style.justifyContent = 'center';
				container.style.alignItems = 'flex-start';
				
				const infoCard = document.createElement('div');
				infoCard.style.marginTop = '20px';
				infoCard.style.padding = '20px';
				infoCard.style.backgroundColor = 'rgba(21, 23, 28, 0.85)';
				infoCard.style.flexDirection = 'column';
				infoCard.style.alignItems = 'center';
				infoCard.style.width = '450px';

				const title = document.createElement('div');
				title.style.color = '#4da6ff';
				title.style.marginBottom = '10px';
				title.style.fontSize = '24px';
				title.textContent = "Three.js + QuickJS Native Layout";
				
				const subtitle = document.createElement('div');
				subtitle.style.color = '#b0b5c0';
				subtitle.style.fontSize = '12px';
				subtitle.textContent = "Hover over instanced spheres. UI layout powered by Taffy (Flexbox)";

				infoCard.appendChild(title);
				infoCard.appendChild(subtitle);
				container.appendChild(infoCard);
				document.body.appendChild(container);

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.enableZoom = false;
				controls.enablePan = false;

				window.addEventListener( 'resize', onWindowResize );
				// OrbitControls handles pointer events, but for raycasting we track pointermove natively
				// winit dispatch is currently on document for pointermove
				document.addEventListener( 'pointermove', onMouseMove );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onMouseMove( event ) {

				event.preventDefault();

				mouse.x = ( event.clientX / globalThis.innerWidth ) * 2 - 1;
				mouse.y = - ( event.clientY / globalThis.innerHeight ) * 2 + 1;
			}

			function animate() {

				controls.update();

				raycaster.setFromCamera( mouse, camera );

				const intersection = raycaster.intersectObject( mesh );

				if ( intersection.length > 0 ) {

					const instanceId = intersection[ 0 ].instanceId;

					mesh.getColorAt( instanceId, color );

					if ( color.equals( white ) ) {

						mesh.setColorAt( instanceId, color.setHex( Math.random() * 0xffffff ) );
						mesh.instanceColor.needsUpdate = true;

					}

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
