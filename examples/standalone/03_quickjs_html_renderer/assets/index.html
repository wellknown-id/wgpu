<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>QuickJS three.js HTML renderer</title>
  </head>
  <body>
    <script type="module">
      import './webgpu-runtime.js';
      import * as THREE from './vendor/three.webgpu.js';
      import { OrbitControls } from './vendor/OrbitControls.js';

      let camera;
      let scene;
      let renderer;
      let mesh;
      let computeNode = null;
      let canvas;

      const query = window.location.search.slice(1);
      const amount = parseInt(query, 10) || 10;
      const useBufferGeometryLoaderSmoke = query === 'buffer-geometry-loader';
      const useFileLoaderSmoke = query === 'file-loader';
      const useObjectLoaderSmoke = query === 'object-loader';
      const useOrbitControlsSmoke = query === 'orbit-controls';
      const useTextureSmoke = query === 'texture';
      const useCubeTextureSmoke = query === 'cube';
      const useCubeMaterialSmoke = query === 'cube-material';
      const useShadowmapSmoke = query === 'shadowmap';
      const usePostprocessingSmoke = query === 'postprocessing';
      const useComputeParticlesSmoke = query === 'compute_particles';
      const count = Math.pow(amount, 3);
      const dummy = new THREE.Object3D();
      let controls;

      console.warn('bootstrap start');
      init().catch((error) => {
        console.error("ERROR MESSAGE:", error.message || String(error));
        console.error("STACK TRACE:", error.stack || "no stack");
      });

      let postProcessing;

  async function init() {
        console.warn('init start');
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          100,
        );
        camera.position.set(amount * 0.9, amount * 0.9, amount * 0.9);
        camera.lookAt(0, 0, 0);

        scene = new THREE.Scene();

        if (useOrbitControlsSmoke) {
          initOrbitControlsSmoke();
        } else if (useObjectLoaderSmoke) {
          await initObjectLoaderSmoke();
        } else if (useBufferGeometryLoaderSmoke) {
          await initBufferGeometryLoaderSmoke();
        } else if (useFileLoaderSmoke) {
          await initFileLoaderSmoke();
        } else if (useCubeMaterialSmoke) {
          await initCubeMaterialSmoke();
        } else if (useCubeTextureSmoke) {
          await initCubeTextureSmoke();
        } else if (useTextureSmoke) {
          await initTextureSmoke();
        } else if (useShadowmapSmoke) {
          initShadowmapSmoke();
        } else if (usePostprocessingSmoke) {
          initPostprocessingSmoke();
        } else if (useComputeParticlesSmoke) {
          initComputeParticlesSmoke();
        } else {
          initInstancingScene();
        }

        canvas = __createCanvasElement();
        renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
        console.warn('renderer constructed');
        renderer.setClearColor(0x204060, 1);
        renderer.toneMapping = THREE.NoToneMapping;
        renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        if (useShadowmapSmoke) {
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        }


        console.warn('before renderer.init');
        await renderer.init();
        console.warn('after renderer.init');

        if (usePostprocessingSmoke) {
          postProcessing = new THREE.PostProcessing(renderer);
          postProcessing.outputNode = new THREE.PassNode('color', scene, camera);
        }
        console.warn(`device.createRenderPipeline type: ${typeof renderer.backend.device.createRenderPipeline}`);
        renderer.clear();

        if (useOrbitControlsSmoke) {
          controls = new OrbitControls(camera, canvas);
          controls.addEventListener('change', () => {});
          const before = camera.position.distanceTo(controls.target);
          const beforePosition = camera.position.clone();
          const beforeQuaternion = camera.quaternion.clone();
          const documentTarget = canvas.ownerDocument;
          canvas.dispatchEvent({
            type: 'pointerdown',
            pointerId: 1,
            pointerType: 'mouse',
            button: 0,
            clientX: canvas.clientWidth * 0.5,
            clientY: canvas.clientHeight * 0.5,
            ctrlKey: false,
            metaKey: false,
            shiftKey: false,
            preventDefault() {},
          });
          documentTarget.dispatchEvent({
            type: 'pointermove',
            pointerId: 1,
            pointerType: 'mouse',
            clientX: canvas.clientWidth * 0.7,
            clientY: canvas.clientHeight * 0.4,
            preventDefault() {},
          });
          documentTarget.dispatchEvent({
            type: 'pointerup',
            pointerId: 1,
            pointerType: 'mouse',
            preventDefault() {},
          });
          const after = camera.position.distanceTo(controls.target);
          const positionChanged = beforePosition.distanceToSquared(camera.position) > 1e-8;
          const quaternionChanged =
            Math.abs(beforeQuaternion.x - camera.quaternion.x) > 1e-8 ||
            Math.abs(beforeQuaternion.y - camera.quaternion.y) > 1e-8 ||
            Math.abs(beforeQuaternion.z - camera.quaternion.z) > 1e-8 ||
            Math.abs(beforeQuaternion.w - camera.quaternion.w) > 1e-8;
          if (!(positionChanged || quaternionChanged || Math.abs(after - before) > 1e-8)) {
            throw new Error('OrbitControls pointer smoke failed to update camera state');
          }
          console.warn(`OrbitControls pointer smoke ok: ${before} -> ${after}`);
        }

        renderer.setAnimationLoop(animate);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
      }

      function initInstancingScene() {
        const geometryJson = JSON.parse(
          __hostReadText('./suzanne_buffergeometry.json'),
        );
        const geometry = new THREE.BufferGeometryLoader().parse(geometryJson);
        geometry.computeVertexNormals();
        geometry.scale(0.5, 0.5, 0.5);

        mesh = new THREE.InstancedMesh(
          geometry,
          new THREE.MeshNormalMaterial(),
          count,
        );
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(mesh);
      }

      async function initBufferGeometryLoaderSmoke() {
        camera.position.set(0, 0, 2.5);
        camera.lookAt(0, 0, 0);

        const geometry = await new THREE.BufferGeometryLoader().loadAsync('./suzanne_buffergeometry.json');
        geometry.computeVertexNormals();
        geometry.scale(0.65, 0.65, 0.65);

        mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshNormalMaterial(),
        );
        scene.add(mesh);
      }

      async function initFileLoaderSmoke() {
        camera.position.set(0, 0, 2.5);
        camera.lookAt(0, 0, 0);

        const text = await new THREE.FileLoader().loadAsync('./suzanne_buffergeometry.json');
        const geometry = new THREE.BufferGeometryLoader().parse(JSON.parse(text));
        geometry.computeVertexNormals();
        geometry.scale(0.65, 0.65, 0.65);

        mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshNormalMaterial(),
        );
        scene.add(mesh);
      }

      async function initObjectLoaderSmoke() {
        camera.position.set(0, 0, 2.5);
        camera.lookAt(0, 0, 0);

        const object = await new THREE.ObjectLoader().loadAsync('./simple_object.json');
        mesh = object;
        scene.add(mesh);
      }

      function initOrbitControlsSmoke() {
        camera.position.set(0, 0, 2.5);
        camera.lookAt(0, 0, 0);

        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.5, 1.5),
          new THREE.MeshNormalMaterial(),
        );
        scene.add(mesh);
      }

      async function initTextureSmoke() {
        camera.position.set(0, 0, 2.5);
        camera.lookAt(0, 0, 0);

        const response = await fetch('./textures/3x3_colors.png');
        const textureBlob = await response.blob();
        const textureUrl = URL.createObjectURL(textureBlob);
        const texture = await new Promise((resolve, reject) => {
          new THREE.TextureLoader().load(
            textureUrl,
            resolve,
            undefined,
            reject,
          );
        });
        URL.revokeObjectURL(textureUrl);

        mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.75, 1.75),
          new THREE.MeshBasicMaterial({ map: texture }),
        );
        scene.add(mesh);
      }

      function initShadowmapSmoke() {
        camera.position.set(0, 10, 20);
        camera.lookAt(0, 0, 0);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        // set up shadow properties
        dirLight.shadow.mapSize.width = 512;
        dirLight.shadow.mapSize.height = 512;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(3, 3, 3),
          new THREE.MeshStandardMaterial({ color: 0x00ff00 }),
        );
        mesh.position.y = 3;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(20, 20),
          new THREE.MeshStandardMaterial({ color: 0x888888 }),
        );
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
      }

      function initPostprocessingSmoke() {
        console.warn('THREE exports containing pass:', Object.keys(THREE).filter(k => k.toLowerCase().includes('pass')).join(', '));
        console.warn('THREE.TSL contains pass?', THREE.TSL && Object.keys(THREE.TSL).includes('pass'));
        camera.position.z = 2;

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1, 1, 1),
          new THREE.MeshStandardMaterial({ color: 0xff0000 }),
        );
        scene.add(mesh);
      }

      function initComputeParticlesSmoke() {
        console.warn("Starting initComputeParticlesSmoke");
        camera.position.set(0, 0, 10);
        camera.lookAt(0, 0, 0);

        const particleCount = 1000;
        
        const positionBuffer = THREE.TSL.instancedArray(particleCount, 'vec3');
        
        computeNode = THREE.TSL.Fn(() => {
           const pos = positionBuffer.element(THREE.TSL.instanceIndex);
           pos.addAssign(THREE.TSL.vec3(0.01, 0.0, 0.0));
        })().compute(particleCount);

        mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1),
            new THREE.MeshBasicMaterial({color: 0x00ff00})
        );
        scene.add(mesh);
        console.warn("Finished initComputeParticlesSmoke");
      }

      async function initCubeTextureSmoke() {
        camera.position.set(0, 0, 0.01);
        camera.lookAt(0, 0, -1);

        const cubeTexture = await loadCubeTexture();

        scene.background = cubeTexture;
      }

      async function initCubeMaterialSmoke() {
        camera.position.set(0, 0, 3);
        camera.lookAt(0, 0, 0);

        const cubeTexture = await loadCubeTexture();

        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.5, 1.5),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            envMap: cubeTexture,
            reflectivity: 1,
          }),
        );
        scene.add(mesh);
      }

      async function loadCubeTexture() {
        const faces = Array(6).fill('./textures/3x3_colors.png');
        return await new Promise((resolve, reject) => {
          new THREE.CubeTextureLoader().load(
            faces,
            resolve,
            undefined,
            reject,
          );
        });
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        try {
          if (!mesh && !useCubeTextureSmoke && !useComputeParticlesSmoke) {
            return;
          }

          const now = Date.now() * 0.001;

          if (useCubeTextureSmoke) {
            camera.rotation.y = now * 0.15;
          } else if (useCubeMaterialSmoke) {
            mesh.rotation.x = now * 0.35;
            mesh.rotation.y = now * 0.5;
          } else if (useOrbitControlsSmoke) {
            controls.update();
            mesh.rotation.y = now * 0.35;
          } else if (useShadowmapSmoke) {
            mesh.rotation.x = now * 0.5;
            mesh.rotation.y = now * 0.5;
          } else if (usePostprocessingSmoke) {
            mesh.rotation.x = now * 0.2;
            mesh.rotation.y = now * 0.6;
          } else if (useObjectLoaderSmoke || useBufferGeometryLoaderSmoke || useFileLoaderSmoke || useTextureSmoke) {
            mesh.rotation.z = now * 0.5;
          } else if (useComputeParticlesSmoke) {
            // do nothing
          } else {
            mesh.rotation.x = Math.sin(now / 4);
            mesh.rotation.y = Math.sin(now / 2);

            let i = 0;
            const offset = (amount - 1) / 2;

            for (let x = 0; x < amount; x++) {
              for (let y = 0; y < amount; y++) {
                for (let z = 0; z < amount; z++) {
                  dummy.position.set(offset - x, offset - y, offset - z);
                  dummy.rotation.y =
                    Math.sin(x / 4 + now) +
                    Math.sin(y / 4 + now) +
                    Math.sin(z / 4 + now);
                  dummy.rotation.z = dummy.rotation.y * 2;
                  dummy.updateMatrix();
                  mesh.setMatrixAt(i++, dummy.matrix);
                }
              }
            }

            mesh.instanceMatrix.needsUpdate = true;
          }

          if (useComputeParticlesSmoke && computeNode) {
            console.warn('RUNNING COMPUTE NODE!');
            try {
                renderer.compute(computeNode);
            } catch (e) {
                console.error("COMPUTE CATCH ERROR:", e.message);
                console.error(e.stack);
            }
          }

          if (usePostprocessingSmoke && postProcessing) {
            postProcessing.render();
          } else {
            renderer.render(scene, camera);
          }
        } catch (error) {
          console.error("ERROR MESSAGE:", error.message || String(error));
          console.error("STACK TRACE:", error.stack || "no stack");
          throw error;
        }
      }
    </script>
  </body>
</html>
