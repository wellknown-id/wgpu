<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: #0b0e17;
    color: #e0e0e0;
    font-size: 14px;
    padding: 0;
    margin: 0;
  }
  .header {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #131829;
    padding: 16px;
    height: 48px;
  }
  .header h1 {
    color: #53d8fb;
    font-size: 22px;
  }
  .nav {
    display: flex;
    padding: 8px;
    background: #0f3460;
    gap: 16px;
  }
  .link {
    color: #e94560;
    font-size: 13px;
    padding: 6px;
  }

  .toolbar {
    display: flex;
    padding: 10px;
    gap: 10px;
    background: #0e1225;
    align-items: center;
  }
  .btn-add {
    background: #e94560;
    color: white;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .btn-clear {
    background: #1a1f36;
    color: #7a8ea8;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .hint {
    color: #4a5568;
    font-size: 12px;
    flex: 1;
  }

  .board {
    display: flex;
    padding: 12px;
    gap: 12px;
  }
  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #111627;
    border-radius: 10px;
    padding: 10px;
    border-width: 2px;
    border-color: #111627;
  }
  .col-header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    border-radius: 8px;
    height: 32px;
  }
  .col-title {
    font-size: 14px;
    color: #e0e0e0;
  }

  .card {
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-radius: 8px;
    background: #1a2035;
    border-width: 2px;
    border-color: #1a2035;
    gap: 4px;
  }
  .card-text {
    font-size: 13px;
    color: #c8d4e0;
  }
  .card-tag {
    font-size: 11px;
    border-radius: 4px;
    padding: 3px;
    background: #0f3460;
    color: #ffffff;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Kanban Board</h1>
  </div>
  <div class="nav">
    <a href="index.html"><div class="link">Back to Home</div></a>
  </div>

  <div class="toolbar">
    <div class="btn-add" id="btn-add">+ New Card</div>
    <div class="btn-clear" id="btn-reset">Reset Board</div>
    <div class="hint" id="hint">Drag a card to another column to move it</div>
  </div>

  <div class="board" id="board">
    <div class="column" id="col-0">
      <div class="col-header" id="colhdr-0" style="background: #1c1042;">
        <div class="col-title" id="coltitle-0">Backlog</div>
      </div>
      <div class="card" id="card-0-0"><div class="card-text" id="ct-0-0">-</div><div class="card-tag" id="tg-0-0">-</div></div>
      <div class="card" id="card-0-1"><div class="card-text" id="ct-0-1">-</div><div class="card-tag" id="tg-0-1">-</div></div>
      <div class="card" id="card-0-2"><div class="card-text" id="ct-0-2">-</div><div class="card-tag" id="tg-0-2">-</div></div>
      <div class="card" id="card-0-3"><div class="card-text" id="ct-0-3">-</div><div class="card-tag" id="tg-0-3">-</div></div>
      <div class="card" id="card-0-4"><div class="card-text" id="ct-0-4">-</div><div class="card-tag" id="tg-0-4">-</div></div>
      <div class="card" id="card-0-5"><div class="card-text" id="ct-0-5">-</div><div class="card-tag" id="tg-0-5">-</div></div>
    </div>

    <div class="column" id="col-1">
      <div class="col-header" id="colhdr-1" style="background: #0f3460;">
        <div class="col-title" id="coltitle-1">In Progress</div>
      </div>
      <div class="card" id="card-1-0"><div class="card-text" id="ct-1-0">-</div><div class="card-tag" id="tg-1-0">-</div></div>
      <div class="card" id="card-1-1"><div class="card-text" id="ct-1-1">-</div><div class="card-tag" id="tg-1-1">-</div></div>
      <div class="card" id="card-1-2"><div class="card-text" id="ct-1-2">-</div><div class="card-tag" id="tg-1-2">-</div></div>
      <div class="card" id="card-1-3"><div class="card-text" id="ct-1-3">-</div><div class="card-tag" id="tg-1-3">-</div></div>
      <div class="card" id="card-1-4"><div class="card-text" id="ct-1-4">-</div><div class="card-tag" id="tg-1-4">-</div></div>
      <div class="card" id="card-1-5"><div class="card-text" id="ct-1-5">-</div><div class="card-tag" id="tg-1-5">-</div></div>
    </div>

    <div class="column" id="col-2">
      <div class="col-header" id="colhdr-2" style="background: #0a3a2a;">
        <div class="col-title" id="coltitle-2">Done</div>
      </div>
      <div class="card" id="card-2-0"><div class="card-text" id="ct-2-0">-</div><div class="card-tag" id="tg-2-0">-</div></div>
      <div class="card" id="card-2-1"><div class="card-text" id="ct-2-1">-</div><div class="card-tag" id="tg-2-1">-</div></div>
      <div class="card" id="card-2-2"><div class="card-text" id="ct-2-2">-</div><div class="card-tag" id="tg-2-2">-</div></div>
      <div class="card" id="card-2-3"><div class="card-text" id="ct-2-3">-</div><div class="card-tag" id="tg-2-3">-</div></div>
      <div class="card" id="card-2-4"><div class="card-text" id="ct-2-4">-</div><div class="card-tag" id="tg-2-4">-</div></div>
      <div class="card" id="card-2-5"><div class="card-text" id="ct-2-5">-</div><div class="card-tag" id="tg-2-5">-</div></div>
    </div>
  </div>

<script>
  var COLS = 3;
  var SLOTS = 6;
  var COL_NAMES = ['Backlog', 'In Progress', 'Done'];
  var COL_COLORS = ['#7c3aed', '#0ea5e9', '#10b981'];
  var COL_BG = ['#1c1042', '#0f3460', '#0a3a2a'];
  var TAG_COLORS = {
    'Feature': '#e94560', 'Core': '#53d8fb', 'Design': '#ffd460',
    'UX': '#6bcb77', 'Perf': '#ff7eb3', 'Docs': '#a78bfa', 'Testing': '#ff7eb3'
  };

  var columns = [
    [
      {text: 'Design system tokens', tag: 'Design'},
      {text: 'Write API documentation', tag: 'Docs'},
      {text: 'Profile GPU memory usage', tag: 'Perf'},
    ],
    [
      {text: 'Implement text input fields', tag: 'Feature'},
      {text: 'Add scroll momentum', tag: 'UX'},
    ],
    [
      {text: 'GPU-accelerated canvas', tag: 'Feature'},
      {text: 'Build flex layout engine', tag: 'Core'},
    ],
  ];

  var drag = null;
  var hoverCol = -1;

  var BOARD_LEFT = 12;
  var BOARD_GAP = 12;

  function getColumnFromX(x) {
    var boardWidth = 800 - BOARD_LEFT * 2;
    var colWidth = (boardWidth - BOARD_GAP * (COLS - 1)) / COLS;
    var rel = x - BOARD_LEFT;
    for (var c = 0; c < COLS; c++) {
      var colLeft = c * (colWidth + BOARD_GAP);
      var colRight = colLeft + colWidth;
      if (rel >= colLeft && rel <= colRight) return c;
    }
    if (rel < 0) return 0;
    return COLS - 1;
  }

  var newCardIdx = 0;
  var newCards = [
    {text: 'Add keyboard shortcuts', tag: 'UX'},
    {text: 'Implement CSS Grid', tag: 'Core'},
    {text: 'Create animation system', tag: 'Feature'},
    {text: 'Add image loading', tag: 'Feature'},
    {text: 'Write unit tests', tag: 'Testing'},
    {text: 'Optimize text shaping', tag: 'Perf'},
    {text: 'Add touch event support', tag: 'Feature'},
    {text: 'Theme customization', tag: 'Design'},
  ];

  function render() {
    for (var c = 0; c < COLS; c++) {
      var cards = columns[c];
      document.getElementById('coltitle-' + c).textContent = COL_NAMES[c] + ' (' + cards.length + ')';

      for (var i = 0; i < SLOTS; i++) {
        var card = document.getElementById('card-' + c + '-' + i);
        var ct = document.getElementById('ct-' + c + '-' + i);
        var tg = document.getElementById('tg-' + c + '-' + i);

        if (i < cards.length) {
          card.style.display = 'flex';
          ct.textContent = cards[i].text;
          tg.textContent = cards[i].tag;
          tg.style.background = TAG_COLORS[cards[i].tag] || '#e94560';

          var isDragSource = drag && drag.srcCol === c && drag.srcIdx === i;
          if (isDragSource) {
            card.style.background = '#0d1020';
            card.style.borderColor = '#2a3055';
            ct.style.color = '#3a4558';
          } else {
            card.style.background = '#1a2035';
            card.style.borderColor = '#1a2035';
            ct.style.color = c === 2 ? '#6b7a8a' : '#c8d4e0';
          }
        } else {
          card.style.display = 'none';
        }
      }

      var col = document.getElementById('col-' + c);
      if (drag && hoverCol === c && c !== drag.srcCol) {
        col.style.borderColor = COL_COLORS[c];
        col.style.background = c === 0 ? '#161030' : c === 1 ? '#0c2a50' : '#082820';
      } else {
        col.style.borderColor = '#111627';
        col.style.background = '#111627';
      }
    }

    var hint = document.getElementById('hint');
    if (drag) {
      if (hoverCol >= 0 && hoverCol !== drag.srcCol) {
        hint.textContent = 'Release to drop in ' + COL_NAMES[hoverCol];
        hint.style.color = COL_COLORS[hoverCol];
      } else {
        hint.textContent = 'Dragging "' + columns[drag.srcCol][drag.srcIdx].text + '"...';
        hint.style.color = '#e94560';
      }
    } else {
      hint.textContent = 'Drag a card to another column to move it';
      hint.style.color = '#4a5568';
    }
  }

  function bindEvents() {
    for (var c = 0; c < COLS; c++) {
      for (var i = 0; i < SLOTS; i++) {
        (function(col, idx) {
          var el = document.getElementById('card-' + col + '-' + idx);
          el.addEventListener('pointerdown', function(e) {
            if (idx >= columns[col].length) return;
            drag = {srcCol: col, srcIdx: idx};
            hoverCol = col;
            el.setPointerCapture(e.pointerId);
            var cardData = columns[col][idx];
            var tagCol = __parseColor(TAG_COLORS[cardData.tag] || '#e94560');
            __hostSetDragOverlay(cardData.text, cardData.tag, __packRgba(tagCol));
            render();
          });
        })(c, i);
      }
    }

    document.addEventListener('pointermove', function(e) {
      if (!drag) return;
      var newHover = getColumnFromX(e.clientX);
      if (newHover !== hoverCol) {
        hoverCol = newHover;
        render();
      }
    });

    document.addEventListener('pointerup', function(e) {
      if (!drag) return;
      var targetCol = getColumnFromX(e.clientX);
      if (targetCol !== drag.srcCol && columns[targetCol].length < SLOTS) {
        var card = columns[drag.srcCol].splice(drag.srcIdx, 1)[0];
        columns[targetCol].push(card);
      }
      drag = null;
      hoverCol = -1;
      __hostClearDragOverlay();
      render();
    });

    document.getElementById('btn-add').addEventListener('click', function() {
      if (columns[0].length < SLOTS) {
        var card = newCards[newCardIdx % newCards.length];
        columns[0].push({text: card.text, tag: card.tag});
        newCardIdx++;
        render();
      }
    });

    document.getElementById('btn-reset').addEventListener('click', function() {
      columns = [
        [{text: 'Design system tokens', tag: 'Design'}, {text: 'Write API documentation', tag: 'Docs'}, {text: 'Profile GPU memory usage', tag: 'Perf'}],
        [{text: 'Implement text input fields', tag: 'Feature'}, {text: 'Add scroll momentum', tag: 'UX'}],
        [{text: 'GPU-accelerated canvas', tag: 'Feature'}, {text: 'Build flex layout engine', tag: 'Core'}],
      ];
      drag = null;
      hoverCol = -1;
      render();
    });
  }

  bindEvents();
  render();
  console.log('Kanban board initialized');
</script>
</body>
</html>
