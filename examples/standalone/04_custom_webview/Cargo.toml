[package]
name = "wgpu-example-04-custom-webview"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = ["js"]
js = ["rquickjs"]

[lib]
name = "wgpu_example_04_custom_webview"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.87"
bytemuck = { version = "1.22", features = ["derive"] }
cosmic-text = "0.12"
html5ever = "0.38"
markup5ever_rcdom = "0.38"
pollster = "0.4"
rquickjs = { version = "0.11.0", features = ["loader", "bindgen"], optional = true }
log = "0.4"
taffy = "0.10.0"
wgpu = "29.0.0"
winit = { version = "0.30.8", features = ["android-native-activity"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[package.metadata.android]
package = "com.example.custom_webview"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[package.metadata.android.signing.release]
path = "/home/ben/.android/debug.keystore"
keystore_password = "android"
