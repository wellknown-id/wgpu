[package]
name = "wgpu-example-04-custom-webview"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = ["js"]
js = ["kest/js"]
xr = ["kest/xr"]

[lib]
name = "wgpu_example_04_custom_webview"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
kest = { path = "../../../kest", default-features = false }
winit = { version = "0.30.8", features = ["android-native-activity"] }

[package.metadata.android]
package = "com.example.custom_webview"
build_targets = ["aarch64-linux-android"]
runtime_libs = "jniLibs"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[package.metadata.android.signing.release]
path = "/home/ben/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.application.activity]
config_changes = "screenSize|screenLayout|orientation|keyboardHidden|keyboard|navigation|uiMode|density"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
