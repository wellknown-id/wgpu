[package]
name = "wgpu-example-04-custom-webview"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = ["js"]
js = ["rquickjs"]

[dependencies]
anyhow = "1.0.87"
bytemuck = { version = "1.22", features = ["derive"] }
cosmic-text = "0.12"
html5ever = "0.38"
markup5ever_rcdom = "0.38"
pollster = "0.4"
rquickjs = { version = "0.11.0", features = ["loader"], optional = true }
taffy = "0.10.0"
wgpu = "29.0.0"
winit = { version = "0.30.8", features = ["android-native-activity"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
